<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Transform Volatility to Global Capital - Complete Business & Financial Management Platform">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IcanEra">
  <meta name="application-name" content="IcanEra">
  <meta name="msapplication-TileColor" content="#667eea">
  <meta name="msapplication-config" content="/browserconfig.xml">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Apple Icons (iOS) -->
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">
  
  <!-- Android Icons -->
  <link rel="icon" type="image/png" href="/icons/icon-192x192.png" sizes="192x192">
  <link rel="icon" type="image/png" href="/icons/icon-512x512.png" sizes="512x512">
  
  <!-- Fallback Icon -->
  <link rel="icon" type="image/png" href="/favicon.svg" />
  
  <title>IcanEra - Business Management Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
  
  <!-- Flutterwave Payment Gateway SDK -->
  <!-- async: it is only called when someone taps Pay, and a synchronous
       third-party script here froze the first paint on slow phone networks. -->
  <script async src="https://checkout.flutterwave.com/v3.js"></script>

  <!-- FFmpeg.js is loaded dynamically by VideoClipper component -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font stylesheet (media swap): text paints in the fallback
         serif straight away instead of waiting on Google Fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet" /></noscript>
    <style>.font-serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif}</style>
</head>
<body>
  <div id="root"></div>
  <script src="/runtime-config.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
